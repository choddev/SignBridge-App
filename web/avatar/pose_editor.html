<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Poz Editoru - TID Isaret Dili</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#08090e;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}

#canvas-col{flex:1;position:relative}
canvas{display:block}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#08090e;z-index:50;flex-direction:column;gap:10px}
.spinner{width:36px;height:36px;border:3px solid #1f2535;border-top-color:#6c63ff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#word-display{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:1.2rem;font-weight:700;color:#a78bfa;z-index:10}

#panel{width:320px;background:#0f111a;border-left:1px solid #1f2535;display:flex;flex-direction:column;overflow:hidden}
#panel-header{padding:12px 16px;border-bottom:1px solid #1f2535;display:flex;align-items:center;gap:10px}
#panel-header h2{font-size:.9rem;color:#a78bfa;flex:1}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:.78rem}
.btn-green{background:#22c55e;color:#fff}
.btn-green:hover{background:#16a34a}
.btn-red{background:#ef4444;color:#fff}
.btn-blue{background:#6c63ff;color:#fff}
.btn-gray{background:#1f2535;color:#64748b}

#controls{flex:1;overflow-y:auto;padding:12px 16px}
.section{margin-bottom:16px}
.section-title{font-size:.72rem;font-weight:700;color:#6c63ff;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;cursor:pointer}
.section-title:hover{color:#a78bfa}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.slider-label{font-size:.7rem;color:#64748b;width:30px;text-align:right}
.slider-name{font-size:.72rem;color:#94a3b8;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
input[type=range]{width:100px;height:4px;-webkit-appearance:none;background:#1f2535;border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#6c63ff}
.slider-val{font-size:.68rem;color:#a78bfa;width:35px;font-family:monospace}

#bottom-bar{padding:10px 16px;border-top:1px solid #1f2535;display:flex;flex-direction:column;gap:8px}
#word-input{padding:8px;border-radius:6px;border:1px solid #1f2535;background:#08090e;color:#e2e8f0;font-size:.85rem;outline:none;width:100%}
#btn-row{display:flex;gap:6px}
#btn-row .btn{flex:1}
#saved-list{font-size:.7rem;color:#64748b;max-height:60px;overflow-y:auto;margin-top:4px}
.saved-item{padding:2px 0;cursor:pointer;color:#22c55e}
.saved-item:hover{color:#a78bfa}
#keyframe-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.kf-chip{padding:3px 8px;border-radius:4px;font-size:.7rem;font-weight:700;cursor:pointer;border:1px solid #1f2535;background:#161924;color:#64748b}
.kf-chip.active{background:#6c63ff33;color:#a78bfa;border-color:#6c63ff}
.kf-chip:hover{border-color:#6c63ff}
#kf-info{font-size:.7rem;color:#64748b;margin-top:2px}
</style>
</head>
<body>

<div id="canvas-col">
  <div id="loading"><div class="spinner"></div><div style="color:#64748b;font-size:.8rem">Avatar yukleniyor...</div></div>
  <div id="word-display"></div>
</div>

<div id="panel">
  <div id="panel-header">
    <h2>Poz Editoru</h2>
    <button class="btn btn-gray" onclick="resetPose()">Sifirla</button>
    <label style="font-size:.72rem;color:#64748b;display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="mirror-toggle" onchange="toggleMirror(this.checked)"> Ayna
    </label>
  </div>
  <div id="controls"></div>
  <div id="bottom-bar">
    <input id="word-input" placeholder="Kelime adi (BABA, ANNE...)" value="BABA">
    <div id="keyframe-bar">
      <button class="btn btn-green" onclick="addKeyframe()" style="padding:4px 10px;font-size:.72rem">+ Keyframe</button>
      <button class="btn btn-gray" onclick="deleteKeyframe()" style="padding:4px 8px;font-size:.72rem">Sil</button>
    </div>
    <div id="kf-info">Keyframe yok — once + Keyframe ile ekle</div>
    <div id="btn-row">
      <button class="btn btn-green" onclick="saveWord()">Kaydet</button>
      <button class="btn btn-blue" onclick="previewAnim()">Onizle</button>
    </div>
    <div id="saved-list"></div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════════
// SCENE
// ═══════════════════════════════════════════════
const col=document.getElementById('canvas-col');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x4a5068);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
col.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(32,1,.01,200);
camera.position.set(0,1.4,4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.update();

scene.add(new THREE.AmbientLight(0xffffff,.9));
const dl1=new THREE.DirectionalLight(0xffeedd,2.0);dl1.position.set(1.5,3,2);scene.add(dl1);
const dl2=new THREE.DirectionalLight(0xffffff,1.2);dl2.position.set(-2,2,-1);scene.add(dl2);
const dl3=new THREE.DirectionalLight(0xffffff,.8);dl3.position.set(0,1,-3);scene.add(dl3);

const floor=new THREE.Mesh(new THREE.CircleGeometry(2,64),new THREE.MeshStandardMaterial({color:0x3a3e4e}));
floor.rotation.x=-Math.PI/2;scene.add(floor);

function resize(){const w=col.clientWidth,h=col.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();

// ═══════════════════════════════════════════════
// BONE CONTROLS
// ═══════════════════════════════════════════════
const BONE_GROUPS = [
  {
    name: 'Sag Ust Kol',
    bones: [{ id:'FK-UpperarmR', label:'Ust Kol' }]
  },
  {
    name: 'Sag Onkol (Dirsek)',
    bones: [{ id:'FK-ForearmR', label:'Onkol' }]
  },
  {
    name: 'Sag Bilek',
    bones: [{ id:'FK-HandR', label:'Bilek' }]
  },
  {
    name: 'Sag Bas Parmak',
    bones: [
      { id:'FK-Thumb1R', label:'Thumb1' },
      { id:'FK-Thumb2R', label:'Thumb2' },
      { id:'FK-Thumb3R', label:'Thumb3' },
    ]
  },
  {
    name: 'Sag Isaret Parmagi',
    bones: [
      { id:'FK-Index1R', label:'Index1' },
      { id:'FK-Index2R', label:'Index2' },
      { id:'FK-Index3R', label:'Index3' },
    ]
  },
  {
    name: 'Sag Orta Parmak',
    bones: [
      { id:'FK-Middle1R', label:'Middle1' },
      { id:'FK-Middle2R', label:'Middle2' },
      { id:'FK-Middle3R', label:'Middle3' },
    ]
  },
  {
    name: 'Sag Yuzuk Parmagi',
    bones: [
      { id:'FK-Ring1R', label:'Ring1' },
      { id:'FK-Ring2R', label:'Ring2' },
      { id:'FK-Ring3R', label:'Ring3' },
    ]
  },
  {
    name: 'Sag Serce Parmagi',
    bones: [
      { id:'FK-Pinky1R', label:'Pinky1' },
      { id:'FK-Pinky2R', label:'Pinky2' },
      { id:'FK-Pinky3R', label:'Pinky3' },
    ]
  },
  {
    name: 'Sol Ust Kol',
    bones: [{ id:'FK-UpperarmL', label:'Ust Kol' }]
  },
  {
    name: 'Sol Onkol',
    bones: [{ id:'FK-ForearmL', label:'Onkol' }]
  },
  {
    name: 'Sol Bilek',
    bones: [{ id:'FK-HandL', label:'Bilek' }]
  },
  {
    name: 'Sol Bas Parmak',
    bones: [
      { id:'FK-Thumb1L', label:'Thumb1' },
      { id:'FK-Thumb2L', label:'Thumb2' },
      { id:'FK-Thumb3L', label:'Thumb3' },
    ]
  },
  {
    name: 'Sol Isaret Parmagi',
    bones: [
      { id:'FK-Index1L', label:'Index1' },
      { id:'FK-Index2L', label:'Index2' },
      { id:'FK-Index3L', label:'Index3' },
    ]
  },
  {
    name: 'Sol Orta Parmak',
    bones: [
      { id:'FK-Middle1L', label:'Middle1' },
      { id:'FK-Middle2L', label:'Middle2' },
      { id:'FK-Middle3L', label:'Middle3' },
    ]
  },
  {
    name: 'Sol Yuzuk Parmagi',
    bones: [
      { id:'FK-Ring1L', label:'Ring1' },
      { id:'FK-Ring2L', label:'Ring2' },
      { id:'FK-Ring3L', label:'Ring3' },
    ]
  },
  {
    name: 'Sol Serce Parmagi',
    bones: [
      { id:'FK-Pinky1L', label:'Pinky1' },
      { id:'FK-Pinky2L', label:'Pinky2' },
      { id:'FK-Pinky3L', label:'Pinky3' },
    ]
  },
];

let bones={}, tLocalQ={};
const sliderState={};  // boneId -> {x,y,z}
let mirrorEnabled=false;

window.toggleMirror=function(on){ mirrorEnabled=on; };

// R<->L mirror mapping
function getMirrorBone(boneId){
  if(boneId.endsWith('R')) return boneId.slice(0,-1)+'L';
  if(boneId.endsWith('L')) return boneId.slice(0,-1)+'R';
  return null;
}
function mirrorAxisValue(axis, val){
  // X stays same (curl), Y and Z negate (mirror left/right)
  return (axis==='x') ? val : -val;
}

function buildControls(){
  const container=document.getElementById('controls');
  container.innerHTML='';
  for(const group of BONE_GROUPS){
    const sec=document.createElement('div');
    sec.className='section';
    const title=document.createElement('div');
    title.className='section-title';
    title.textContent=group.name;
    sec.appendChild(title);

    for(const bone of group.bones){
      if(!bones[bone.id]) continue;
      sliderState[bone.id]={x:0,y:0,z:0};

      for(const axis of ['x','y','z']){
        const row=document.createElement('div');
        row.className='slider-row';

        const nameEl=document.createElement('span');
        nameEl.className='slider-name';
        nameEl.textContent=bone.label;
        row.appendChild(nameEl);

        const labelEl=document.createElement('span');
        labelEl.className='slider-label';
        labelEl.textContent=axis.toUpperCase();
        row.appendChild(labelEl);

        const slider=document.createElement('input');
        slider.type='range';
        slider.min='-3.14';
        slider.max='3.14';
        slider.step='0.05';
        slider.value='0';
        slider.dataset.bone=bone.id;
        slider.dataset.axis=axis;
        row.appendChild(slider);

        const valEl=document.createElement('span');
        valEl.className='slider-val';
        valEl.textContent='0.00';
        row.appendChild(valEl);

        slider.oninput=()=>{
          const v=parseFloat(slider.value);
          valEl.textContent=v.toFixed(2);
          sliderState[bone.id][axis]=v;
          // Mirror
          if(mirrorEnabled){
            const mirrorId=getMirrorBone(bone.id);
            if(mirrorId && sliderState[mirrorId]){
              const mv=mirrorAxisValue(axis, v);
              sliderState[mirrorId][axis]=mv;
              // Update mirror slider UI
              document.querySelectorAll(`input[data-bone="${mirrorId}"][data-axis="${axis}"]`).forEach(ms=>{
                ms.value=mv;
                ms.nextElementSibling.textContent=mv.toFixed(2);
              });
            }
          }
          applyPose();
        };

        sec.appendChild(row);
      }
    }
    container.appendChild(sec);
  }
}

function applyPose(){
  // Reset all to T-pose first
  for(const name in tLocalQ){
    if(bones[name]) bones[name].quaternion.copy(tLocalQ[name]);
  }
  // Apply slider rotations
  for(const boneId in sliderState){
    const s=sliderState[boneId];
    const bone=bones[boneId];
    if(!bone||!tLocalQ[boneId]) continue;
    const euler=new THREE.Euler(s.x,s.y,s.z,'XYZ');
    const q=new THREE.Quaternion().setFromEuler(euler);
    bone.quaternion.copy(tLocalQ[boneId].clone().multiply(q));
  }
}

window.resetPose=function(){
  for(const boneId in sliderState){
    sliderState[boneId]={x:0,y:0,z:0};
  }
  document.querySelectorAll('input[type=range]').forEach(s=>{
    s.value='0';
    s.nextElementSibling.textContent='0.00';
  });
  applyPose();
};

// ═══════════════════════════════════════════════
// KEYFRAME SYSTEM
// ═══════════════════════════════════════════════
const savedWords={};   // word -> [keyframe1, keyframe2, ...]
let currentKFs=[];     // current word's keyframes
let activeKF=-1;       // which keyframe is selected

function getSliderSnapshot(){
  const snap={};
  for(const boneId in sliderState) snap[boneId]={...sliderState[boneId]};
  return snap;
}

function loadSnapshot(snap){
  for(const boneId in snap){
    if(!sliderState[boneId]) continue;
    sliderState[boneId]={...snap[boneId]};
  }
  document.querySelectorAll('input[type=range]').forEach(s=>{
    const bid=s.dataset.bone, axis=s.dataset.axis;
    if(sliderState[bid]){
      s.value=sliderState[bid][axis];
      s.nextElementSibling.textContent=sliderState[bid][axis].toFixed(2);
    }
  });
  applyPose();
}

window.addKeyframe=function(){
  currentKFs.push(getSliderSnapshot());
  activeKF=currentKFs.length-1;
  updateKFBar();
  document.getElementById('word-display').textContent='Keyframe '+(activeKF+1)+' eklendi';
  setTimeout(()=>document.getElementById('word-display').textContent='',1500);
};

window.deleteKeyframe=function(){
  if(activeKF<0||currentKFs.length===0) return;
  currentKFs.splice(activeKF,1);
  if(activeKF>=currentKFs.length) activeKF=currentKFs.length-1;
  if(activeKF>=0) loadSnapshot(currentKFs[activeKF]);
  updateKFBar();
};

function selectKF(idx){
  if(idx<0||idx>=currentKFs.length) return;
  // Save current slider state to active keyframe before switching
  if(activeKF>=0&&activeKF<currentKFs.length) currentKFs[activeKF]=getSliderSnapshot();
  activeKF=idx;
  loadSnapshot(currentKFs[idx]);
  updateKFBar();
}

function updateKFBar(){
  const bar=document.getElementById('keyframe-bar');
  // Keep buttons, remove chips
  const chips=bar.querySelectorAll('.kf-chip');
  chips.forEach(c=>c.remove());
  for(let i=0;i<currentKFs.length;i++){
    const chip=document.createElement('span');
    chip.className='kf-chip'+(i===activeKF?' active':'');
    chip.textContent=(i+1);
    chip.onclick=()=>selectKF(i);
    bar.appendChild(chip);
  }
  const info=document.getElementById('kf-info');
  if(currentKFs.length===0) info.textContent='Keyframe yok — once + Keyframe ile ekle';
  else if(currentKFs.length===1) info.textContent='1 keyframe (sabit poz). Dinamik isaret icin daha fazla ekle.';
  else info.textContent=currentKFs.length+' keyframe — avatar sirayla hepsini yapacak';
}

// SAVE word (all keyframes)
window.saveWord=function(){
  const word=document.getElementById('word-input').value.trim().toUpperCase();
  if(!word){alert('Kelime adi gir!');return;}
  // Save current slider state to active keyframe
  if(activeKF>=0&&activeKF<currentKFs.length) currentKFs[activeKF]=getSliderSnapshot();
  if(currentKFs.length===0){alert('Once keyframe ekle!');return;}
  savedWords[word]=[...currentKFs];
  updateSavedList();
  document.getElementById('word-display').textContent=word+' kaydedildi! ('+currentKFs.length+' keyframe)';
  setTimeout(()=>document.getElementById('word-display').textContent='',2000);
  // Save to server
  fetch('/api/save-pose',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({word, pose:currentKFs})
  }).then(r=>r.json()).then(d=>console.log('Saved:',d)).catch(e=>console.warn('Server save failed:',e));
};

function loadWord(word){
  const kfs=savedWords[word];
  if(!kfs) return;
  document.getElementById('word-input').value=word;
  currentKFs=kfs.map(kf=>{const c={};for(const b in kf)c[b]={...kf[b]};return c});
  activeKF=0;
  loadSnapshot(currentKFs[0]);
  updateKFBar();
}

function updateSavedList(){
  const el=document.getElementById('saved-list');
  el.innerHTML='Kaydedilenler: '+Object.keys(savedWords).map(w=>{
    const n=savedWords[w].length;
    return `<span class="saved-item" onclick="loadWord_('${w}')">${w}(${n})</span>`;
  }).join(', ');
}
window.loadWord_=loadWord;

// ═══════════════════════════════════════════════
// PREVIEW ANIMATION (multi-keyframe)
// ═══════════════════════════════════════════════
let previewing=false;

function lerpPose(poseA, poseB, t){
  // Interpolate between two keyframes
  for(const boneId in sliderState){
    const a=poseA[boneId]||{x:0,y:0,z:0};
    const b=poseB[boneId]||{x:0,y:0,z:0};
    sliderState[boneId]={x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, z:a.z+(b.z-a.z)*t};
  }
  applyPose();
}

window.previewAnim=async function(){
  if(previewing) return;
  if(activeKF>=0&&activeKF<currentKFs.length) currentKFs[activeKF]=getSliderSnapshot();
  if(currentKFs.length===0){alert('Keyframe ekle once!');return;}
  previewing=true;

  const word=document.getElementById('word-input').value.trim().toUpperCase();
  document.getElementById('word-display').textContent=word;

  const steps=20;
  const delay=()=>new Promise(r=>setTimeout(r,25));
  const zeroPose={};
  for(const b in sliderState) zeroPose[b]={x:0,y:0,z:0};

  // T-pose -> first keyframe
  for(let i=0;i<=steps;i++){lerpPose(zeroPose,currentKFs[0],i/steps);await delay();}

  // Keyframe transitions
  for(let k=0;k<currentKFs.length-1;k++){
    await new Promise(r=>setTimeout(r,300));
    for(let i=0;i<=steps;i++){lerpPose(currentKFs[k],currentKFs[k+1],i/steps);await delay();}
  }

  // Hold last keyframe
  await new Promise(r=>setTimeout(r,600));

  // Last keyframe -> T-pose
  const lastKF=currentKFs[currentKFs.length-1];
  for(let i=steps;i>=0;i--){lerpPose(zeroPose,lastKF,i/steps);await delay();}

  // Restore active keyframe
  if(activeKF>=0) loadSnapshot(currentKFs[activeKF]);
  document.getElementById('word-display').textContent='';
  previewing=false;
};

// ═══════════════════════════════════════════════
// LOAD AVATAR
// ═══════════════════════════════════════════════
new GLTFLoader().load('rain.glb',gltf=>{
  const avatar=gltf.scene;
  avatar.traverse(o=>{
    o.castShadow=true;
    if(o.isBone) bones[o.name]=o;
  });

  avatar.scale.setScalar(1);avatar.position.set(0,0,0);
  scene.add(avatar);avatar.updateMatrixWorld(true);
  const bb=new THREE.Box3();
  avatar.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)bb.expandByObject(o)});
  const h=bb.isEmpty()?1:(bb.max.y-bb.min.y);
  const sc=h>.01?1.7/h:1;
  avatar.scale.setScalar(sc);
  avatar.position.set(0,-(bb.isEmpty()?0:bb.min.y)*sc,0);
  avatar.updateMatrixWorld(true);

  const fb=new THREE.Box3().setFromObject(avatar);
  const ctr=new THREE.Vector3();fb.getCenter(ctr);
  const sz=new THREE.Vector3();fb.getSize(sz);
  camera.position.set(0,ctr.y+sz.y*.1,sz.y*1.5);
  controls.target.set(0,ctr.y,0);controls.update();

  // Save T-pose
  avatar.traverse(o=>{if(o.isBone)tLocalQ[o.name]=o.quaternion.clone()});

  document.getElementById('loading').style.display='none';
  buildControls();

  // Load saved poses from server
  fetch('/api/list-poses').then(r=>r.json()).then(d=>{
    if(d.poses){
      for(const[word,pose] of Object.entries(d.poses)){
        // Normalize: old single dict -> array
        savedWords[word] = Array.isArray(pose) ? pose : [pose];
      }
      updateSavedList();
    }
  }).catch(()=>{});

  // Debug: FK kemiklerini listele
  const fkBones=Object.keys(bones).filter(n=>n.startsWith('FK-'));
  console.info('Poz Editoru hazir!',Object.keys(bones).length,'kemik,',fkBones.length,'FK kemik');
  console.info('FK kemikler:',fkBones.join(', '));
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090e">
<title>SignBridge — Türk İşaret Dili Çevirisi</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI',sans-serif;
  background:#08090e;
  color:#e2e8f0;
  display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* ── Background glow orbs ── */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;
  z-index:0;filter:blur(45px);
}
body::before{
  width:580px;height:580px;
  background:radial-gradient(circle,rgba(108,99,255,0.20),transparent 70%);
  top:-200px;left:-160px;
  animation:floatA 22s ease-in-out infinite;
}
body::after{
  width:480px;height:480px;
  background:radial-gradient(circle,rgba(34,211,238,0.13),transparent 70%);
  bottom:-180px;right:-120px;
  animation:floatB 25s ease-in-out infinite;
}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}

/* ── Topbar ── */
.topbar{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:24px;
  padding:14px 28px;
  background:rgba(15,17,26,0.7);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.06);
  flex-shrink:0;
}

.brand{display:flex;align-items:center;gap:12px}
.brand-icon{
  width:40px;height:40px;border-radius:12px;
  background:conic-gradient(from 220deg,#6c63ff,#22d3ee,#ec4899,#6c63ff);
  display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(108,99,255,0.45);
  position:relative;overflow:hidden;
  animation:spinSlow 14s linear infinite;
}
.brand-icon::after{content:"";position:absolute;inset:2px;border-radius:10px;background:#08090e;animation:spinSlow 14s linear infinite reverse}
.brand-icon svg{position:relative;z-index:1;width:20px;height:20px;color:#a78bfa}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand-name{
  font-family:'Space Grotesk',sans-serif;
  font-weight:800;font-size:1.1rem;letter-spacing:-0.02em;
  background:linear-gradient(135deg,#a78bfa,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-tag{font-size:0.72rem;color:#64748b;font-weight:500;margin-top:-1px}

/* ── Tab pill (centered) ── */
.tab-pill{
  display:inline-flex;
  padding:5px;
  background:rgba(15,17,26,0.6);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  position:relative;
  margin:0 auto;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.tab-btn{
  position:relative;z-index:2;
  padding:11px 28px;
  border-radius:12px;
  font-size:0.9rem;font-weight:700;
  color:#94a3b8;
  background:transparent;border:none;
  display:flex;align-items:center;gap:10px;
  transition:color 0.3s;
  cursor:pointer;
  font-family:inherit;
  letter-spacing:0.01em;
}
.tab-btn svg{width:17px;height:17px}
.tab-btn.active{color:#fff}
.tab-indicator{
  position:absolute;top:5px;bottom:5px;
  background:linear-gradient(135deg,#6c63ff,#a78bfa);
  border-radius:12px;
  transition:all 0.4s cubic-bezier(0.65,0.05,0.36,1);
  box-shadow:0 8px 22px rgba(108,99,255,0.5),inset 0 1px 0 rgba(255,255,255,0.18);
  z-index:1;
}

/* ── Right info ── */
.top-info{
  margin-left:auto;
  display:flex;align-items:center;gap:10px;
  font-size:0.78rem;
}
.stat-pill{
  padding:6px 13px;border-radius:999px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  color:#a8aec1;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.stat-pill .dot{
  width:7px;height:7px;border-radius:50%;
  background:#10b981;box-shadow:0 0 10px #10b981;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* ── Iframe stage ── */
.stage{
  flex:1;position:relative;z-index:1;
  overflow:hidden;
}
.frame-wrap{
  position:absolute;inset:14px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.07);
  box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);
  background:#0a0b14;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.35s ease;
}
.frame-wrap.active{
  opacity:1;
  pointer-events:auto;
}
iframe{
  width:100%;height:100%;
  border:none;display:block;
  background:#08090e;
}

/* Loading ribbon for first-time iframe load */
.frame-wrap::after{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#6c63ff,#22d3ee,#6c63ff);
  background-size:200% 100%;
  animation:shimmer 1.4s linear infinite;
  opacity:0;transition:opacity 0.3s;
  z-index:2;pointer-events:none;
}
.frame-wrap.loading::after{opacity:1}
@keyframes shimmer{to{background-position:-200% 0}}

/* ── Mobile responsive ── */
@media (max-width: 800px){
  .topbar{gap:12px;padding:12px 16px;flex-wrap:wrap}
  .brand-tag{display:none}
  .top-info{order:3;width:100%;justify-content:flex-end;margin-left:0}
  .tab-btn{padding:10px 20px;font-size:0.85rem}
  .frame-wrap{inset:8px;border-radius:14px}
}
@media (max-width: 480px){
  .topbar{padding:10px 12px}
  .brand-name{font-size:1rem}
  .tab-btn{padding:9px 16px;font-size:0.8rem}
  .tab-btn svg{width:15px;height:15px}
  .stat-pill{padding:5px 10px;font-size:0.72rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M5 12h14M5 12l4-4M5 12l4 4M19 6v12"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="brand-name">SignBridge</div>
      <div class="brand-tag">Türk İşaret Dili — Çift yönlü çeviri</div>
    </div>
  </div>

  <nav class="tab-pill">
    <div class="tab-indicator" id="tabIndicator"></div>
    <button class="tab-btn active" data-tab="camera" onclick="switchTab('camera')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Kamera
    </button>
    <button class="tab-btn" data-tab="avatar" onclick="switchTab('avatar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Avatar
    </button>
  </nav>

  <div class="top-info">
    <div class="stat-pill"><span class="dot"></span><span>Canlı</span></div>
    <div class="stat-pill">100 kelime</div>
  </div>
</header>

<main class="stage">
  <div class="frame-wrap active loading" id="frame-camera">
    <iframe src="/camera-page" title="Kamera" id="iframe-camera"></iframe>
  </div>
  <div class="frame-wrap" id="frame-avatar">
    <iframe data-src="/avatar/step4_blender_player.html" title="Avatar" id="iframe-avatar"></iframe>
  </div>
</main>

<script>
function switchTab(tab){
  document.querySelectorAll('.frame-wrap').forEach(f=>f.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const fw = document.getElementById('frame-'+tab);
  fw.classList.add('active');
  document.querySelector('.tab-btn[data-tab="'+tab+'"]').classList.add('active');

  // Lazy-load iframe on first activation
  const iframe = document.getElementById('iframe-'+tab);
  if(iframe.dataset.src && !iframe.src){
    fw.classList.add('loading');
    iframe.src = iframe.dataset.src;
    iframe.removeAttribute('data-src');
    iframe.addEventListener('load', ()=>fw.classList.remove('loading'), {once:true});
  }
  positionIndicator();
}

function positionIndicator(){
  const active = document.querySelector('.tab-btn.active');
  const ind = document.getElementById('tabIndicator');
  if(!active||!ind) return;
  const r = active.getBoundingClientRect();
  const pr = active.parentElement.getBoundingClientRect();
  ind.style.left = (r.left - pr.left) + 'px';
  ind.style.width = r.width + 'px';
}
window.addEventListener('load', ()=>{
  positionIndicator();
  // Camera iframe loaded -> hide shimmer
  const cf = document.getElementById('iframe-camera');
  cf.addEventListener('load', ()=>{
    document.getElementById('frame-camera').classList.remove('loading');
  }, {once:true});
});
window.addEventListener('resize', positionIndicator);
</script>

</body>
</html>
